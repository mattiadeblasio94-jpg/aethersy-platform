# =============================================================================
# Jarvis — stack OpenJarvis (Fase 35).
#
# Servizi:
#   jarvis       -> server OpenJarvis (chat + STT), immagine costruita dal repo
#   caddy       -> TLS automatico per jarvis.aethersy.online (opzionale)
#
# Il servizio si aggancia alla rete esterna della piattaforma
# (`aethersy_default`): cosi' la console puo' raggiungerlo con
# http://aethersy-jarvis:8000 senza esporre porte pubbliche.
#
# Le chiavi (NVIDIA, z.ai, OpenRouter, credenziali piattaforma) stanno nel
# file .env del VPS: nessun segreto in questo file.
# =============================================================================

services:
  jarvis:
    build:
      context: ..
      dockerfile: jarvis/Dockerfile
      args:
        OPENJARVIS_REPO: ${OPENJARVIS_REPO:-https://github.com/mattiadeblasio94-jpg/OpenJarvis.git}
        OPENJARVIS_REF: ${OPENJARVIS_REF:-main}
    image: aethersy-jarvis:${JARVIS_VERSION:-0.1.0}
    container_name: aethersy-jarvis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - JARVIS_HOST=0.0.0.0
      - JARVIS_PORT=8000
      - OPENJARVIS_CONFIG=/opt/openjarvis/config.toml
      - OPENJARVIS_SKILLS_DIR=/opt/openjarvis/skills/aethersy-plugins
      - AETHERSY_API_BASE=${AETHERSY_API_BASE:-https://platform.aethersy.online}
      - AETHERSY_REPO=${AETHERSY_REPO:-/home/deploy/aethersy}
      - NIM_API_KEY=${NIM_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    volumes:
      # Repository della piattaforma: serve al coding agent (aethersy_change).
      - ${AETHERSY_REPO:-/home/deploy/aethersy}:/opt/aethersy-infra
    # Nessuna porta pubblica: il traffico passa dalla rete Docker interna.
    expose:
      - "8000"
    networks:
      - platform_net

  caddy:
    image: caddy:2.8-alpine
    container_name: aethersy-jarvis-caddy
    restart: unless-stopped
    profiles: ["public"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - JARVIS_DOMAIN=${JARVIS_DOMAIN:-jarvis.aethersy.online}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - jarvis
    networks:
      - platform_net

networks:
  platform_net:
    external: true
    name: ${PLATFORM_NETWORK:-aethersy_default}

volumes:
  caddy_data:
  caddy_config:
