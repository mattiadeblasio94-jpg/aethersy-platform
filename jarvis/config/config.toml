# =============================================================================
# Configurazione di Jarvis (template). Non contiene segreti: le chiavi stanno
# nell'ambiente del container (file .env sul VPS).
#
# Engine: "nim" = NVIDIA integrate API (tool-calling verificato). Sono
# supportati anche "openrouter" e "zai"; OpenJarvis non usa Ollama.
# =============================================================================

[engine]
default = "nim"

[intelligence]
# Nemotron 3.5 Lightning su NVIDIA NIM: risposta in 1-3 secondi e quota
# aziendale, quindi regge la conversazione in tempo reale. Gemini (engine
# "google") resta il modello di riserva quando la quota giornaliera e' libera.
default_model = "nvidia/nemotron-3.5-lightning-30b-a3b"
# Modello di riserva quando il primario e' saturo (quota o rate limit):
# Nemotron Bolt sulla stessa chiave NIM (risposta in meno di un secondo),
# poi Gemini quando la quota giornaliera e' libera.
fallback_model = "nvidia/nemotron-3.5-bolt-e4b"
provider = "local"
temperature = 0.2
# 1024 token bastano per una risposta parlabile e non esauriscono la quota
# del provider su una singola richiesta.
max_tokens = 1024

[speech]
# STT locale: faster-whisper su CPU, modello small, lingua italiana.
# "small" riconosce correttamente i termini di prodotto (vault, business,
# obiettivi): con "base" la trascrizione scambiava vault/volt.
backend = "faster-whisper"
model = "small"
language = "it"
device = "cpu"
compute_type = "int8"

[tools]
enabled = [
  "aethersy_control",
  "aethersy_memory",
  "aethersy_change",
  "aethersy_speak",
  "think",
  "calculator",
]

[skills]
skills_dir = "/opt/openjarvis/skills/aethersy-plugins"

[agent]
orchestrator = "default"
max_turns = 12

[server]
host = "0.0.0.0"
port = 8000
