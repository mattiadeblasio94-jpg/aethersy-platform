name: aethersy

# Stack Activepieces self-hosted per aethersy.
# - app: UI + API + endpoint MCP (porta interna 80)
# - worker: esecuzione dei flow (AP_CONTAINER_TYPE=WORKER)
# - postgres / redis: solo rete interna, nessuna porta pubblicata
# - caddy: unico ingresso pubblico (80/443), TLS automatico
#
# Nessun segreto qui: tutto via .env (vedi .env.example).

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: aethersy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      - APP_DOMAIN=${APP_DOMAIN:-app.aethersy.online}
      - MCP_DOMAIN=${MCP_DOMAIN:-mcp.aethersy.online}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-platform.aethersy.online}
      - APEX_DOMAIN=${APEX_DOMAIN:-aethersy.online}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - app
      - platform
    networks:
      - aethersy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    image: ghcr.io/activepieces/activepieces:${AP_VERSION}
    container_name: aethersy-app
    restart: unless-stopped
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=APP
      - AP_POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}
    ports:
      # Esposto solo su localhost: serve per gli health check locali e il debug.
      # Il traffico pubblico passa esclusivamente da Caddy.
      - "127.0.0.1:${AP_HOST_PORT:-8080}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./cache:/usr/src/app/cache
      # --- Fase 8: branding Aethersy (read-only) --------------------------
      # La Community edition ignora nome/logo/colori del DB e serve sempre
      # `defaultTheme`. Questi bind-mount applicano il brand senza rebuild.
      # Vedi docs/phases.md (Fase 8) e scripts/05-branding.sh.
      - ./branding/theme.js:/usr/src/app/packages/server/api/dist/src/app/flags/theme.js:ro
      - ./branding/web/logo.svg:/usr/src/app/dist/packages/web/logo.svg:ro
      - ./branding/web/favicon.ico:/usr/src/app/dist/packages/web/favicon.ico:ro
      - ./branding/web/logo-192.png:/usr/src/app/dist/packages/web/logo-192.png:ro
      - ./branding/web/logo-180.png:/usr/src/app/dist/packages/web/logo-180.png:ro
      - ./branding/web/brand:/usr/src/app/dist/packages/web/brand:ro
    networks:
      - aethersy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    image: ghcr.io/activepieces/activepieces:${AP_VERSION}
    container_name: aethersy-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=WORKER
      # Il worker deve raggiungere l'app sul nome di servizio interno,
      # NON sul dominio pubblico (che per lui non risolve).
      - AP_FRONTEND_URL=http://app
    depends_on:
      - app
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - aethersy
    deploy:
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Piattaforma Aethersy (technical brief): SPA React mock-first servita da nginx.
  # Nessuna porta pubblica e nessun env: entra solo da Caddy su PLATFORM_DOMAIN.
  # Il layer anteprima e' anche dentro la Console su /preview (Fase 12 P0.8);
  # questo servizio espone la stessa app come sito autonomo dedicato.
  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    image: aethersy-platform:${PLATFORM_VERSION:-0.1.0}
    container_name: aethersy-platform
    restart: unless-stopped
    networks:
      - aethersy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Console proprietaria Aethersy (BFF auth + AI router): serve /api/auth/* per la piattaforma.
  # Nessun dominio pubblico dedicato: entra solo da Caddy su PLATFORM_DOMAIN via /api/*.
  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    image: aethersy-console:${CONSOLE_VERSION:-0.1.0}
    container_name: aethersy-console
    restart: unless-stopped
    # Nessun bind-mount di dist: il codice eseguito e' quello compilato
    # nell'immagine. Il mount precedente serviva per patchare il JS a mano e
    # lasciava invecchiare il dist sul disco (il container ignorava l'immagine
    # appena ricostruita).
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AP_INTERNAL_URL=http://app:80
      - AP_PUBLIC_URL=https://${APP_DOMAIN:-app.aethersy.online}
      - CONSOLE_SESSION_SECRET=${CONSOLE_SESSION_SECRET}
      - CONSOLE_COOKIE_DOMAIN=.aethersy.online
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - VENICE_API_KEY=${VENICE_API_KEY:-}
      - VENICE_BASE_URL=${VENICE_BASE_URL:-https://api.venice.ai/api/v1}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY:-}
      - REPLICATE_BASE_URL=${REPLICATE_BASE_URL:-https://api.replicate.com/v1}
      - FAL_API_KEY=${FAL_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_BASE_URL=${ZAI_BASE_URL:-https://api.z.ai/api/paas/v4}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_TIMEOUT_MS=${NVIDIA_TIMEOUT_MS:-90000}
      - NVIDIA_MAX_TOKENS=${NVIDIA_MAX_TOKENS:-8192}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - TELEGRAM_CLIENT_ID=${TELEGRAM_CLIENT_ID:-}
      - TELEGRAM_CLIENT_SECRET=${TELEGRAM_CLIENT_SECRET:-}
      - TELEGRAM_REDIRECT_URI=${TELEGRAM_REDIRECT_URI:-}
      - PLATFORM_PUBLIC_URL=${PLATFORM_PUBLIC_URL:-https://platform.aethersy.online}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - JARVIS_BASE_URL=${JARVIS_BASE_URL:-}
      - JARVIS_API_KEY=${JARVIS_API_KEY:-}
      - JARVIS_TIMEOUT_MS=${JARVIS_TIMEOUT_MS:-120000}
      - JARVIS_MODEL=${JARVIS_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - JARVIS_MODEL_FALLBACK=${JARVIS_MODEL_FALLBACK:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - JARVIS_PRIMARY_TIMEOUT_MS=${JARVIS_PRIMARY_TIMEOUT_MS:-20000}
      - JARVIS_EVENTS_TOKEN=${JARVIS_EVENTS_TOKEN:-}
      - JARVIS_EVENTS_TENANT_ID=${JARVIS_EVENTS_TENANT_ID:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_BASE_URL=${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-nPczCjzI2devNBz1zQrb}
      - ELEVENLABS_MODEL=${ELEVENLABS_MODEL:-eleven_flash_v2_5}
      - ELEVENLABS_SCRIBE_MODEL=${ELEVENLABS_SCRIBE_MODEL:-scribe_v1}
      - ELEVENLABS_STT_ENABLED=${ELEVENLABS_STT_ENABLED:-true}
      - META_API_KEY=${META_API_KEY:-}
      - META_BASE_URL=${META_BASE_URL:-https://api.meta.ai/v1}
      - META_MODEL=${META_MODEL:-}
      - CONSOLE_PUBLIC_URL=${CONSOLE_PUBLIC_URL:-https://console.aethersy.online}
      - CONSOLE_PGHOST=postgres
      - CONSOLE_PGPORT=5432
      - CONSOLE_PGUSER=${AP_POSTGRES_USERNAME}
      - CONSOLE_PGPASSWORD=${AP_POSTGRES_PASSWORD}
      - CONSOLE_PGDATABASE=${AP_POSTGRES_DATABASE}
      - CONSOLE_REDIS_HOST=redis
      - CONSOLE_REDIS_PORT=6379
      - CONSOLE_REDIS_PASSWORD=${AP_REDIS_PASSWORD}
      - METERING_ENABLED=${METERING_ENABLED:-false}
      - METERING_RATE_PER_MINUTE=${METERING_RATE_PER_MINUTE:-120}
      - METERING_SIGNUP_CREDITS=${METERING_SIGNUP_CREDITS:-0}
      - CONSOLE_SECRETS_KEY=${CONSOLE_SECRETS_KEY:-}
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY}
      - BUILDER_SANDBOX_IMAGE=${BUILDER_SANDBOX_IMAGE:-aethersy/builder-sandbox:0.1.0}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # Wix: server MCP (tool e-commerce/blog/analytics) + token REST opzionale.
      - WIX_MCP_CLIENT_ID=${WIX_MCP_CLIENT_ID:-}
      - WIX_MCP_CLIENT_SECRET=${WIX_MCP_CLIENT_SECRET:-}
      - WIX_MCP_SCOPE=${WIX_MCP_SCOPE:-offline_access}
      - WIX_SITE_ID=${WIX_SITE_ID:-}
      # Notifica di deploy: versione e commit finiscono nella notifica in-app
      # e nel messaggio Slack generati all'avvio del BFF.
      - APP_VERSION=${APP_VERSION:-dev}
      - DEPLOY_COMMIT=${DEPLOY_COMMIT:-}
      - DEPLOY_SERVICES=${DEPLOY_SERVICES:-console, platform}
      - DEPLOY_HOOK_TOKEN=${DEPLOY_HOOK_TOKEN:-}
    # Il builder esegue i task degli agenti in container isolati: serve il socket
    # Docker per crearli (vedi console/server/src/builder/agents/sandbox.ts).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - aethersy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    container_name: aethersy-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_DB=${AP_POSTGRES_DATABASE}
      - POSTGRES_USER=${AP_POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aethersy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AP_POSTGRES_USERNAME} -d ${AP_POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.0.7
    container_name: aethersy-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${AP_REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - aethersy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${AP_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  redis_data:

networks:
  aethersy:
    driver: bridge
