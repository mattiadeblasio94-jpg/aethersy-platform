name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# La pipeline e' read-only: non ha permessi di scrittura e non deploya.
# Il deploy resta manuale (scripts/deploy-console.sh sul VPS, vedi docs/runbook.md).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console-server:
    name: console/server (typecheck + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/server/package-lock.json
      - name: Install
        working-directory: console/server
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: console/server
        run: npm run typecheck
      - name: Build
        working-directory: console/server
        run: npm run build
      - name: Test metering
        working-directory: console/server
        run: npm run test:metering
      - name: Test PDF deliverable
        working-directory: console/server
        run: npm run test:pdf

  platform:
    name: platform (typecheck + build, include la Console unificata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install
        working-directory: platform
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: platform
        run: npm run typecheck
      - name: Build
        working-directory: platform
        run: npm run build

  hygiene:
    name: igiene (segreti + compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: bash scripts/secret-scan.sh
      - name: Docker compose config
        run: |
          # compose carica sempre anche il .env predefinito della cartella:
          # nel runner non esiste (e non deve esistere), quindi si crea vuoto.
          touch .env
          docker compose --env-file .env.example config --quiet
