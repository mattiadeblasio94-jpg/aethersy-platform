# SPA Aethersy Platform: asset statici + fallback su index.html per il router.
# Nessuna porta pubblicata: entra solo da Caddy su {$PLATFORM_DOMAIN}.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Asset con hash nel nome: cache lunga e immutabile.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html mai in cache: deve puntare sempre agli asset dell'ultimo build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
