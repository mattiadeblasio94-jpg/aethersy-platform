# =============================================================================
# Jarvis — stack OpenJarvis (Fase 35).
#
# Servizi:
#   jarvis       -> server OpenJarvis (chat + STT), immagine costruita dal repo
#   caddy       -> TLS automatico per jarvis.aethersy.online (opzionale)
#
# Il servizio si aggancia alla rete esterna della piattaforma
# (`aethersy_aethersy`): cosi' la console puo' raggiungerlo con
# http://aethersy-jarvis:8000 senza esporre porte pubbliche.
#
# Le chiavi (NVIDIA, z.ai, OpenRouter, credenziali piattaforma) stanno nel
# file .env del VPS: nessun segreto in questo file.
# =============================================================================

services:
  jarvis:
    build:
      context: ..
      dockerfile: jarvis/Dockerfile
      args:
        OPENJARVIS_REPO: ${OPENJARVIS_REPO:-https://github.com/mattiadeblasio94-jpg/OpenJarvis.git}
        OPENJARVIS_REF: ${OPENJARVIS_REF:-main}
    image: aethersy-jarvis:${JARVIS_VERSION:-0.1.0}
    container_name: aethersy-jarvis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - JARVIS_HOST=0.0.0.0
      - JARVIS_PORT=8000
      - OPENJARVIS_CONFIG=/opt/openjarvis/config.toml
      - OPENJARVIS_SKILLS_DIR=/opt/openjarvis/skills/aethersy-plugins
      - AETHERSY_API_BASE=${AETHERSY_API_BASE:-https://platform.aethersy.online}
      - AETHERSY_REPO=${AETHERSY_REPO:-/home/deploy/aethersy}
      - NIM_API_KEY=${NIM_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    volumes:
      # Repository della piattaforma: serve al coding agent (aethersy_change).
      - ${AETHERSY_REPO:-/home/deploy/aethersy}:/opt/aethersy-infra
      # Stato runtime di Jarvis (config, knowledge.db, tracce) persistito.
      - jarvis_state:/var/lib/openjarvis
    # Nessuna porta pubblica: il traffico passa dalla rete Docker interna.
    expose:
      - "8000"
    networks:
      - platform_net

  # Watcher: il processo che tiene Jarvis VIGILE. Osserva la piattaforma e
  # segnala al BFF tutto quello che merita attenzione (lead, ordini, run
  # falliti, saldi in esaurimento, servizi non sani). La pagina /jarvis li
  # riceve in streaming e li annuncia anche a voce.
  watcher:
    image: python:3.12-slim
    container_name: aethersy-jarvis-watcher
    restart: unless-stopped
    command: ["python", "-u", "/opt/watcher/watch.py"]
    env_file:
      - .env
    environment:
      - AETHERSY_API_BASE=${AETHERSY_API_BASE:-https://platform.aethersy.online}
      - JARVIS_EVENTS_URL=${JARVIS_EVENTS_URL:-https://platform.aethersy.online/api/platform/jarvis/events}
      - JARVIS_EVENTS_TOKEN=${JARVIS_EVENTS_TOKEN:-}
      - WATCH_INTERVAL_SEC=${WATCH_INTERVAL_SEC:-120}
      - WATCH_DIGEST_EVERY=${WATCH_DIGEST_EVERY:-30}
      - WATCH_LOW_BALANCE=${WATCH_LOW_BALANCE:-10}
      - WATCH_STATE_FILE=/state/watcher-state.json
    volumes:
      - ./watcher:/opt/watcher:ro
      - watcher_state:/state
    networks:
      - platform_net

  caddy:
    image: caddy:2.8-alpine
    container_name: aethersy-jarvis-caddy
    restart: unless-stopped
    profiles: ["public"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - JARVIS_DOMAIN=${JARVIS_DOMAIN:-jarvis.aethersy.online}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - jarvis
    networks:
      - platform_net

networks:
  platform_net:
    external: true
    name: ${PLATFORM_NETWORK:-aethersy_aethersy}

volumes:
  jarvis_state:
  caddy_data:
  caddy_config:
  watcher_state:
